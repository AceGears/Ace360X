name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Native host tests + fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build clang-18 libclang-rt-18-dev
      - name: Configure
        run: cmake -S native -B build-host -G Ninja -DCMAKE_CXX_COMPILER=clang++-18 -DACE_BUILD_FUZZERS=ON
      - name: Build
        run: cmake --build build-host
      - name: Unit tests
        run: ctest --test-dir build-host --output-on-failure
      - name: Fuzz format sniffer (120 s)
        run: |
          mkdir -p corpus
          ./build-host/format_sniffer_fuzzer corpus -max_total_time=120 -max_len=4096

  android:
    name: Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: Ace360X-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
